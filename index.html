<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BLOCK RUNNER — a retro platformer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="frame">
    <h1><span class="c1">B</span><span class="c2">L</span><span class="c3">O</span><span class="c4">C</span><span class="c1">K</span> <span class="c3">R</span><span class="c2">U</span><span class="c1">N</span><span class="c4">N</span><span class="c3">E</span><span class="c2">R</span></h1>
    <canvas id="game" width="384" height="256"></canvas>
    <div id="hud">
      <span id="score">SCORE: 0</span>
      <span id="lives">LIVES: 3</span>
      <span id="level">LEVEL: 1</span>
    </div>
    <p id="instructions">ARROWS / A-D to move &middot; SPACE / W / UP to jump &middot; ENTER to start</p>
  </div>
  <script src="game.js"></script>
</body>
</html>
